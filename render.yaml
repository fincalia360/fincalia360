# Configuración de publicación en Render (https://render.com) — «Blueprint».
# Crea un servicio web Node con un disco persistente para la base de datos SQLite.
# Los valores marcados con `sync: false` los rellenas tú en el panel de Render al crear el servicio.
# Ver docs/publicar-en-internet.md.
services:
  - type: web
    name: fincalia360
    runtime: node
    region: frankfurt # servidores en la Unión Europea
    plan: starter # el disco persistente requiere un plan de pago (~7 $/mes)
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    disk:
      name: datos
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        value: file:/var/data/fincalia360.db
      # Fotos de los inmuebles y documentos de autorización: en el mismo disco persistente
      # (se conservan entre publicaciones). Ver docs/portal-y-zona-inmobiliarias.md
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: SEED_DEMO_DATA
        value: "false"
      - key: STUDY_EXAMPLE_DATA
        value: "false"
      - key: AI_PROVIDER
        value: demo
      # Asistente virtual del estudio (Claude). Sin clave, el chat no se muestra.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-5-5
      - key: CHAT_DAILY_MESSAGE_LIMIT
        value: "500"
      # Correo (Resend). Sin estas variables no se envía ningún correo (no se simula).
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: TEAM_NOTIFICATION_EMAIL
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: SITE_URL
        sync: false
      - key: ALLOW_INDEXING
        value: "false"
      - key: LEGAL_OWNER_NAME
        sync: false
      - key: LEGAL_OWNER_NIF
        sync: false
      - key: LEGAL_OWNER_ADDRESS
        sync: false
      - key: LEGAL_CONTACT_EMAIL
        sync: false
      - key: LEGAL_OWNER_REGISTRY
        sync: false
      - key: LEGAL_HOSTING_PROVIDER
        value: "Render Services, Inc. (servidores en Frankfurt, Unión Europea)"
